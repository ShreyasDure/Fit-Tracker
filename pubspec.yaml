name: fit_tracker
description: "FitTracker - A modern fitness tracking app with User and Admin roles."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  flutter_riverpod: ^2.6.1
  fl_chart: ^1.2.0
  google_fonts: ^8.0.2
  go_router: ^17.2.2
  http: ^1.2.0
  pedometer: ^4.2.0
  permission_handler: ^12.0.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.4
  open_file: ^3.5.11
  share_plus: ^12.0.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
